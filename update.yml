name: Aggiorna prezzi Conad generico

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Installa Chromium
        run: python -m playwright install --with-deps chromium

      - name: Test parser
        run: python test_offline.py

      - name: Aggiorna prezzi Conad
        run: python updater_conad_auto.py --db prezzi_conad.db

      - name: Verifica database
        run: |
          python - <<'PY'
          import sqlite3, os
          p="prezzi_conad.db"
          if not os.path.exists(p):
              raise SystemExit("Database non creato")
          con=sqlite3.connect(p)
          n=con.execute("select count(*) from products_current where store_code='CONAD-GENERICO'").fetchone()[0]
          ok=con.execute("select count(*) from update_log where store_code='CONAD-GENERICO' and status='OK'").fetchone()[0]
          print("Prodotti unici:", n)
          print("Query completate:", ok)
          if n <= 0 or ok <= 0:
              raise SystemExit("Database vuoto o incompleto")
          PY

      - name: Salva database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prezzi_conad.db
          git diff --cached --quiet || git commit -m "Aggiornamento automatico prezzi Conad"
          git push

      - name: Salva diagnostica se fallisce
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conad-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
