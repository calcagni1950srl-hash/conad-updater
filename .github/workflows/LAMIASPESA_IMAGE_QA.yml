name: La Mia Spesa Image QA

on:
  push:
    paths:
      - '.github/workflows/LAMIASPESA_IMAGE_QA.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Conad and Lidl validated DBs
        run: |
          curl -L --fail --retry 3 https://raw.githubusercontent.com/calcagni1950srl-hash/conad-updater/probe-conad-full-catalog/prezzi_conad_capodrise_stable_full.db -o /tmp/conad.db
          curl -L --fail --retry 3 https://raw.githubusercontent.com/calcagni1950srl-hash/conad-updater/probe-lidl-catalog/prezzi_lidl_everli.db -o /tmp/lidl.db

      - name: Test real image URLs
        run: |
          python - <<'PY'
          import json, sqlite3, urllib.request

          tests=[]

          def take(label,db,table,col,namecol,where="price_eur>0"):
              con=sqlite3.connect(db)
              rows=con.execute(
                  f"SELECT {namecol},{col} FROM {table} WHERE {where} AND COALESCE({col},'')<>'' LIMIT 6"
              ).fetchall()
              con.close()
              for name,url in rows:
                  tests.append((label,name,url))

          take("Famila","prezzi_famila_app.db","products","image_url","product_name")
          take("Sole365","prezzi_sole365_app.db","products","image_url","product_name")
          take("Conad","/tmp/conad.db","products_current","image_url","product_name")
          take("Lidl","/tmp/lidl.db","products_android","image","product_name")

          results=[]
          for label,name,url in tests:
              ok=False; status=None; ctype=None; error=None
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"LaMiaSpesa-Android/1.0"})
                  with urllib.request.urlopen(req,timeout=12) as r:
                      status=getattr(r,"status",200)
                      ctype=r.headers.get("Content-Type","")
                      data=r.read(128)
                      ok=(200 <= status < 300 and len(data)>0)
              except Exception as e:
                  error=repr(e)
              results.append({"market":label,"name":name,"url":url,"ok":ok,"status":status,"content_type":ctype,"error":error})

          summary={}
          for label,_,_ in tests:
              subset=[x for x in results if x["market"]==label]
              summary[label]={"ok":sum(1 for x in subset if x["ok"]),"total":len(subset)}

          print(json.dumps(summary,ensure_ascii=False))
          open("lamiaspesa_image_qa.json","w",encoding="utf-8").write(json.dumps({"summary":summary,"results":results},ensure_ascii=False,indent=2))
          if any(v["ok"] == 0 for v in summary.values()):
              raise SystemExit("No reachable images for one or more markets")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: lamiaspesa-image-qa
          path: lamiaspesa_image_qa.json
