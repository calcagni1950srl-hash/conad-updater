name: V81 MAIN CONAD FLYER OVERVIEW

on:
  workflow_dispatch:
  push:
    paths:
      - 'qa_v81_mainflyer/render_overview.py'
      - '.github/workflows/V81_MAIN_CONAD_FLYER_OVERVIEW.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pymupdf pillow
      - run: python qa_v81_mainflyer/render_overview.py
      - name: Stamp run id
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("qa_v81_mainflyer/summary.json").write_text(
              json.dumps({"run_id":int(os.environ["GITHUB_RUN_ID"])},indent=2),
              encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v81-main-conad-flyer-overview
          path: |
            qa_v81_mainflyer/overview.jpg
            qa_v81_mainflyer/p*.png
            qa_v81_mainflyer/summary.json
      - name: Commit summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa_v81_mainflyer/summary.json
          git diff --cached --quiet && exit 0
          git commit -m "Record V81 main flyer overview run"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
