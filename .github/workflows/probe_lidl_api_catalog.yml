name: Probe Lidl API catalog
on:
  push:
    branches: [probe-lidl-catalog]
    paths:
      - LIDL_API_CATALOG.py
      - LIDL_EVERLI_PROBE.py
      - LIDL_EXPORT_V81_TSV.py
      - LIDL_SEARCH_TERM_PROBE.py
      - LIDL_RECIPE_CATALOG.py
      - LIDL_STAPLE_DETAIL_PROBE.py
      - LIDL_SITEMAP_PROBE.py
      - LIDL_FRAGMENT_PROBE.py
      - LIDL_GRIDBOX_PROBE.py
      - LIDL_GRIDBOX_V2_PROBE.py
      - qa_v81/**
      - .github/workflows/probe_lidl_api_catalog.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probe-lidl-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Probe Lidl Everli catalog
        run: python LIDL_EVERLI_PROBE.py
      - name: Build API catalog
        run: python LIDL_API_CATALOG.py
      - name: Probe missing-staple search parameters
        run: python LIDL_SEARCH_TERM_PROBE.py
      - name: Probe Lidl gridboxes v2
        run: python LIDL_GRIDBOX_V2_PROBE.py | tee lidl_gridbox_v2_report.txt
      - name: Probe Lidl gridboxes endpoint
        run: python LIDL_GRIDBOX_PROBE.py | tee lidl_gridbox_report.txt
      - name: Inspect Lidl dynamic search fragments
        run: python LIDL_FRAGMENT_PROBE.py | tee lidl_fragment_report.txt
      - name: Probe official Lidl sitemap
        run: python LIDL_SITEMAP_PROBE.py | tee lidl_sitemap_report.txt
      - name: Inspect staple result details
        run: python LIDL_STAPLE_DETAIL_PROBE.py | tee lidl_staple_detail_report.txt
      - name: Build recipe-driven Lidl catalog
        run: python LIDL_RECIPE_CATALOG.py
      - name: Recipe catalog SQLite integrity
        run: sqlite3 prezzi_lidl_recipe.db "PRAGMA integrity_check; SELECT COUNT(*) FROM products;"
      - name: SQLite integrity
        run: sqlite3 prezzi_lidl_api.db "PRAGMA integrity_check; SELECT COUNT(*) FROM products;"
      - name: Export Lidl catalog for exact V81 matcher
        run: python LIDL_EXPORT_V81_TSV.py
      - name: Install Kotlin compiler 2.0.21
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl
          curl -L -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Compile exact Smart Campania matcher
        run: |
          /tmp/kotlin/kotlinc/bin/kotlinc             qa_v81/SupermarketRepositoryStub.kt             qa_v81/ShoppingCalculator.kt             qa_v81/IngredientMatcher_V81_CONAD.kt             qa_v81/ConadV81Harness.kt             -include-runtime -d /tmp/lidl-v81-harness.jar
      - name: Run exact 157 recipe Lidl coverage
        run: |
          set -o pipefail
          java -jar /tmp/lidl-v81-harness.jar qa_v81/products_lidl_api.tsv qa_v81/recipes_v61_157.tsv 2 Lidl | tee lidl_v81_coverage_report.txt
      - name: Coverage summary
        run: |
          python - <<'PY'
          import re, json
          from pathlib import Path
          t=Path("lidl_v81_coverage_report.txt").read_text(encoding="utf-8")
          keys=["products","recipes_total","recipes_testable","recipes_complete","recipes_failed",
                "primi_complete","secondi_complete","contorni_complete","piatti_unici_complete","dolci_complete",
                "threshold_primi","threshold_secondi","threshold_contorni",
                "eur50_persons","eur50_days","eur50_primi","eur50_secondi","eur50_contorni",
                "eur50_unique_recipes","eur50_unresolved","eur50_total","eur50_variety_ok","eur50_has_legumes","eur50_has_fish","eur50_has_meat","eur50_has_fish_primo","eur50_has_meat_primo","eur50_semantic_variety_ok","eur50_feasible"]
          out={}
          for k in keys:
              m=re.search(rf"(?m)^{re.escape(k)}=(.+)$",t)
              out[k]=m.group(1).strip() if m else None
          Path("lidl_v81_coverage_summary.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lidl-api-catalog
          path: |
            prezzi_lidl_api.db
            prezzi_lidl_everli.db
            lidl_everli_raw.json
            lidl_everli_products.json
            lidl_everli_errors.json
            prezzi_lidl_recipe.db
            lidl_api_products.json
            lidl_api_raw.json
            lidl_search_term_probe.json
            lidl_recipe_products.json
            lidl_recipe_catalog_summary.json
            lidl_recipe_query_errors.json
            qa_v81/products_lidl_api.tsv
            lidl_v81_coverage_report.txt
            lidl_v81_coverage_summary.json
