name: Export Existing Conad Generic DB
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/export_conad_generic_db.yml'
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect DB
        run: |
          python - <<'PY'
          import sqlite3, json, os
          p='prezzi_conad.db'
          con=sqlite3.connect(p)
          tabs=[x[0] for x in con.execute("select name from sqlite_master where type='table'")]
          out={'bytes':os.path.getsize(p),'tables':tabs}
          if 'products_current' in tabs:
              out['rows']=con.execute('select count(*) from products_current').fetchone()[0]
              out['positive']=con.execute('select count(*) from products_current where price_eur>0').fetchone()[0]
              out['stores']=con.execute('select store_code,count(*) from products_current group by store_code').fetchall()
          print(json.dumps(out))
          con.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: conad-generic-existing-db
          path: prezzi_conad.db
