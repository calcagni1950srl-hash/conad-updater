name: La Mia Spesa Full Conad Export

on:
  push:
    branches: [probe-conad-full-catalog]
    paths:
      - '.github/workflows/LAMIASPESA_FULL_CONAD_EXPORT.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probe-conad-full-catalog

      - name: Export full Conad TSV
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          con=sqlite3.connect("prezzi_conad_capodrise_stable_full.db")
          con.row_factory=sqlite3.Row
          out=Path("conad_full.tsv")
          with out.open("w",encoding="utf-8") as f:
              f.write("market\tkey\tstore\tname\tbrand\tcategory\tqv\tqu\tqtext\tprice\tup\tupu\tuptext\tvariable\timage\n")
              q="""SELECT supermarket,store_code,store_name,product_code,product_name,brand,
                          category1,category2,category3,quantity_value,quantity_unit,price_eur,
                          unit_price,unit_price_unit,variable_weight,image_url
                   FROM products_current WHERE price_eur>0"""
              for r in con.execute(q):
                  cat=" > ".join(x for x in [r["category1"],r["category2"],r["category3"]] if x)
                  vals=[
                      "Conad", f'CONAD:{r["store_code"]}:{r["product_code"]}',
                      r["store_name"] or r["store_code"] or "", r["product_name"] or "",
                      r["brand"] or "", cat, r["quantity_value"], r["quantity_unit"] or "",
                      "", r["price_eur"], r["unit_price"], r["unit_price_unit"] or "",
                      "", r["variable_weight"] or 0, r["image_url"] or ""
                  ]
                  f.write("\t".join("" if x is None else str(x).replace("\t"," ").replace("\n"," ") for x in vals)+"\n")
          con.close()
          print(out.stat().st_size)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: lamiaspesa-full-conad-tsv
          path: conad_full.tsv
