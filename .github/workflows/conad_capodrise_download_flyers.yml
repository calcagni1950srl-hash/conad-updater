name: Conad Capodrise Flyer PDFs
on:
  workflow_dispatch:
  push:
    paths:
      - 'conad_capodrise_download_flyers.py'
      - '.github/workflows/conad_capodrise_download_flyers.yml'
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python conad_capodrise_download_flyers.py
      - uses: actions/upload-artifact@v4
        with:
          name: conad-capodrise-food-flyers
          path: conad_flyers/
