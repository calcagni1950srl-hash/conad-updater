name: CONAD BASSI FISSI ENGINE

on:
  workflow_dispatch:
  push:
    paths:
      - 'CONAD_BASSI_FISSI_ENGINE.py'
      - '.github/workflows/CONAD_BASSI_FISSI_ENGINE.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Download and validate all Conad Bassi e Fissi
        run: python CONAD_BASSI_FISSI_ENGINE.py
      - name: Audit SQLite
        run: |
          python - <<'PY'
          import sqlite3, json
          con=sqlite3.connect('prezzi_conad_capodrise.db')
          n=con.execute('select count(*) from products_current').fetchone()[0]
          pos=con.execute('select count(*) from products_current where price_eur>0').fetchone()[0]
          stores=con.execute('select distinct store_code from products_current').fetchall()
          print(json.dumps({'rows':n,'positive':pos,'stores':stores}))
          assert n>700
          assert n==pos
          assert stores==[('010548',)]
          con.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: conad-bassi-fissi-db
          path: |
            prezzi_conad_capodrise.db
            conad_bassifissi_audit.json
      - name: Commit validated DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prezzi_conad_capodrise.db conad_bassifissi_audit.json
          git diff --cached --quiet && exit 0
          git commit -m "Update validated Conad Bassi e Fissi DB"
          git push
