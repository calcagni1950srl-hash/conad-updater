name: Famila Auto Build Validated DB

on:
  push:
    paths:
      - '.github/workflows/famila_auto_build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-famila-db:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Famila Teverola database
        run: python famila_updater_http_v3.py --store teverola --db prezzi_famila.db --report famila_audit.json

      - name: Validate Famila database and audit
        run: |
          python - <<'PY'
          import json, sqlite3, sys
          from pathlib import Path

          db = Path('prezzi_famila.db')
          audit_path = Path('famila_audit.json')
          if not db.exists() or not audit_path.exists():
              raise SystemExit('DB o audit Famila mancanti')

          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          if audit.get('verdict') != 'FAMILA_HTTP_UPDATER_V2_VALIDATED':
              raise SystemExit(f"Audit Famila non validato: {audit.get('verdict')}")

          con = sqlite3.connect(db)
          total = con.execute('SELECT COUNT(*) FROM products').fetchone()[0]
          positive = con.execute('SELECT COUNT(*) FROM products WHERE price_eur > 0').fetchone()[0]
          con.close()

          if total <= 0 or total != positive:
              raise SystemExit(f'DB Famila non valido: total={total}, positive={positive}')
          if total < 500:
              raise SystemExit(f'DB Famila troppo piccolo per il confronto: {total} prodotti')

          print(f'FAMILA_DB_VALIDATED products={total} positive={positive}')
          PY

      - name: Publish validated Famila DB in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prezzi_famila.db famila_audit.json
          if git diff --cached --quiet; then
            echo 'Nessuna modifica da pubblicare'
          else
            git commit -m 'Update validated Famila Teverola prices'
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: famila-validated-db
          path: |
            prezzi_famila.db
            famila_audit.json
          if-no-files-found: warn
