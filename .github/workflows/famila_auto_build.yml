name: Famila Auto Build Validated DB

on:
  push:
    paths:
      - '.github/workflows/famila_auto_build.yml'
      - 'famila_fetch_category.py'
      - 'famila_merge_categories.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  FAMILA_SITE: familasud
  FAMILA_STORE: teverola

jobs:
  fetch-categories:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { code: '10006', name: 'Frutta e verdura' }
          - { code: '10013', name: 'Salumi e formaggi' }
          - { code: '10007', name: 'Gastronomia e pasta fresca' }
          - { code: '10009', name: 'Latte, burro, uova e yogurt' }
          - { code: '10003', name: 'Carne' }
          - { code: '10011', name: 'Pesce' }
          - { code: '10004', name: 'Colazione, merenda e dolci' }
          - { code: '10012', name: 'Prodotti alimentari' }
          - { code: '10010', name: 'Pane e pasticceria' }
          - { code: '10008', name: 'Gelati e surgelati' }
          - { code: '10002', name: 'Acqua, bevande, vino e alcolici' }
          - { code: '10015', name: 'Tutto per il bambino' }
          - { code: '10001', name: 'Amici animali' }
          - { code: '10005', name: 'Cura della persona' }
          - { code: '10016', name: 'Tutto per la casa' }
          - { code: '10014', name: 'Tempo libero' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Fetch category ${{ matrix.code }}
        run: >-
          python famila_fetch_category.py
          --site "$FAMILA_SITE"
          --store "$FAMILA_STORE"
          --code '${{ matrix.code }}'
          --name '${{ matrix.name }}'
          --output 'category_${{ matrix.code }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: famila-cat-${{ matrix.code }}
          path: category_${{ matrix.code }}.json
          if-no-files-found: error

  merge-and-publish:
    needs: fetch-categories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: famila-cat-*
          path: famila_categories
          merge-multiple: true
      - name: Merge and audit Famila database
        run: >-
          python famila_merge_categories.py
          --input famila_categories
          --site "$FAMILA_SITE"
          --store "$FAMILA_STORE"
          --db prezzi_famila.db
          --report famila_audit.json
      - name: Publish validated Famila DB
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prezzi_famila.db famila_audit.json
          if git diff --cached --quiet; then
            echo 'Nessuna modifica da pubblicare'
          else
            git commit -m 'Update validated Famila Teverola prices'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: famila-validated-db
          path: |
            prezzi_famila.db
            famila_audit.json
          if-no-files-found: error
