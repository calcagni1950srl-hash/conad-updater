name: Conad Capodrise Browser Probe

on:
  push:
    paths:
      - 'conad_capodrise_browser_probe.py'
      - '.github/workflows/conad_capodrise_browser_probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install chromium
      - name: Capture official Conad browser flow
        run: python conad_capodrise_browser_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conad-capodrise-browser-probe
          path: |
            conad_capodrise_browser.json
            conad_capodrise_browser.png
          if-no-files-found: warn
