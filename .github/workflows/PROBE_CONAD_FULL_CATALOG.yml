name: PROBE CONAD FULL CATALOG

on:
  push:
    branches:
      - probe-conad-full-catalog
    paths:
      - 'PROBE_CONAD_FULL_CATALOG.py'
      - '.github/workflows/PROBE_CONAD_FULL_CATALOG.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - run: python PROBE_CONAD_FULL_CATALOG.py
      - uses: actions/upload-artifact@v4
        with:
          name: conad-full-catalog-probe
          path: probe_full_catalog.json
