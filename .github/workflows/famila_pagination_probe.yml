name: Famila Pagination Probe

on:
  push:
    paths:
      - 'famila_pagination_probe.py'
      - '.github/workflows/famila_pagination_probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python famila_pagination_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: famila-pagination-probe
          path: famila_pagination_probe.json
          if-no-files-found: warn
