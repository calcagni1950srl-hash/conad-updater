name: Conad Capodrise Flyer Metadata Probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'conad_capodrise_flyer_metadata_probe.py'
      - '.github/workflows/conad_capodrise_flyer_metadata_probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python conad_capodrise_flyer_metadata_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: conad-capodrise-flyer-metadata
          path: conad_capodrise_flyer_metadata.json
