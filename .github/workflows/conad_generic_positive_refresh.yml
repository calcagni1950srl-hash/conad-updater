name: Conad Generic Positive Refresh

on:
  workflow_dispatch:
  push:
    paths:
      - 'conad_positive_filter.py'
      - '.github/workflows/conad_generic_positive_refresh.yml'
  schedule:
    - cron: '30 4 * * *'
    - cron: '30 5 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gate scheduled run to 06 local Rome time
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run_update=true" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=Europe/Rome date +%H)" = "06" ]; then
            echo "run_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_update=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run_update == 'true'
        with:
          python-version: '3.12'

      - name: Install Playwright
        if: steps.gate.outputs.run_update == 'true'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Refresh official generic Conad catalog
        if: steps.gate.outputs.run_update == 'true'
        run: python updater_conad_auto.py --db prezzi_conad.db

      - name: Keep only positive prices and validate essentials
        if: steps.gate.outputs.run_update == 'true'
        run: python conad_positive_filter.py

      - name: Audit filtered DB
        if: steps.gate.outputs.run_update == 'true'
        run: python conad_db_audit.py

      - name: Validate audit
        if: steps.gate.outputs.run_update == 'true'
        run: |
          python - <<'PY'
          import json
          a=json.load(open('conad_db_audit.json', encoding='utf-8'))
          assert a['rows_total'] > 0, 'empty DB'
          assert a['positive_prices'] == a['rows_total'], 'not all rows have positive price'
          assert a['zero_prices'] == 0, 'zero prices remain'
          for k in ('latte','pasta','uova'):
              assert a['checks'][k]['count'] > 0, f'missing {k}'
          print('CONAD_GENERIC_DB_VALIDATED', a['rows_total'])
          PY

      - name: Save validated DB and audit to repository
        if: steps.gate.outputs.run_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prezzi_conad.db conad_db_audit.json conad_positive_filter_report.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update validated Conad generic prices"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run_update == 'true'
        with:
          name: conad-generic-positive-refresh
          path: |
            prezzi_conad.db
            conad_db_audit.json
            conad_positive_filter_report.json
            diagnostics/
          if-no-files-found: ignore
          retention-days: 30
