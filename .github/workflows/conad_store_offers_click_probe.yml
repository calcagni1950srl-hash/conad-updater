name: Conad Store Offers Click Probe
on:
  push:
    paths:
      - 'conad_store_offers_click_probe.py'
      - '.github/workflows/conad_store_offers_click_probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Click Capodrise in-store offers component
        run: python conad_store_offers_click_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conad-store-offers-click-probe
          path: |
            conad_store_offers_click_probe.json
            conad_store_offers_click_probe.png
