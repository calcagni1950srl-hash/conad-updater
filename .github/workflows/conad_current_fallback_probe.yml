name: Conad Current Fallback Probe
on:
  push:
    paths:
      - 'conad_current_fallback_probe.py'
      - '.github/workflows/conad_current_fallback_probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: pip install requests beautifulsoup4
      - name: Read current fallback prices
        run: python conad_current_fallback_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conad-current-fallback-probe
          path: conad_current_fallback_probe.json
