name: Famila Page Param Probe

on:
  push:
    paths:
      - 'famila_page_param_probe.py'
      - '.github/workflows/famila_page_param_probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python famila_page_param_probe.py
