name: Conad DB Quality Audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'conad_db_audit.py'
      - '.github/workflows/conad_db_audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Conad database
        run: python conad_db_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: conad-db-audit
          path: conad_db_audit.json
