name: Conad Bassi e Fissi Loader Probe
on:
  push:
    paths:
      - 'conad_bassifissi_loader_probe.py'
      - '.github/workflows/conad_bassifissi_loader_probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probe loader parameters
        run: python conad_bassifissi_loader_probe.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conad-bassifissi-loader-probe
          path: conad_bassifissi_loader_probe.json
