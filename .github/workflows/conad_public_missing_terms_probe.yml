name: Conad Public Missing Terms Probe
on:
  push:
    paths:
      - 'conad_public_missing_terms_probe.py'
      - '.github/workflows/conad_public_missing_terms_probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: pip install requests
      - name: Probe current public Conad search prices
        run: python conad_public_missing_terms_probe.py
