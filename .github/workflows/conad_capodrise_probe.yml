name: Conad Capodrise Probe

on:
  push:
    paths:
      - 'conad_capodrise_probe.py'
      - '.github/workflows/conad_capodrise_probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Probe official Conad Capodrise source
        run: python conad_capodrise_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conad-capodrise-probe
          path: conad_capodrise_probe.json
          if-no-files-found: error
