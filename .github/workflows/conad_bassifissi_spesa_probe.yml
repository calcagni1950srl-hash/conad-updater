name: Conad Bassi Fissi Spesa Probe
on:
  push:
    paths:
      - 'conad_bassifissi_spesa_probe.py'
      - '.github/workflows/conad_bassifissi_spesa_probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probe Bassi e Fissi public pagination
        run: python conad_bassifissi_spesa_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conad-bassifissi-spesa-probe
          path: |
            conad_bassifissi_spesa_probe.json
            conad_bassifissi_spesa_probe.png
