name: BUILD CONAD STABLE FULL DB

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_conad_stable_full_db.yml'
      - 'prezzi_conad_capodrise_stable_full.db.gz'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probe-conad-full-catalog

      - name: Expand verified full Conad SQLite
        run: |
          gzip -dc prezzi_conad_capodrise_stable_full.db.gz > prezzi_conad_capodrise_stable_full.db

      - name: Audit stable full DB
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path

          p=Path('prezzi_conad_capodrise_stable_full.db')
          con=sqlite3.connect(p)
          total=con.execute('SELECT COUNT(*) FROM products_current').fetchone()[0]
          positive=con.execute('SELECT COUNT(*) FROM products_current WHERE price_eur > 0').fetchone()[0]
          variable=con.execute('SELECT COUNT(*) FROM products_current WHERE variable_weight = 1').fetchone()[0]
          stores=con.execute('SELECT DISTINCT store_code FROM products_current ORDER BY store_code').fetchall()
          metadata=dict(con.execute('SELECT key,value FROM metadata').fetchall())
          con.close()

          expected={
            'total':6841,
            'positive':6841,
            'stores':[('010548',)],
            'catalog_complete':'true',
            'food_rows':'6841',
            'source_unique_skus':'8877',
            'flyer_rows':'0',
            'visual_rows':'0'
          }
          if total != expected['total'] or positive != expected['positive'] or stores != expected['stores']:
              raise SystemExit(f'QA FAIL total={total} positive={positive} stores={stores}')
          for k in ('catalog_complete','food_rows','source_unique_skus','flyer_rows','visual_rows'):
              if metadata.get(k) != expected[k]:
                  raise SystemExit(f'QA FAIL metadata {k}={metadata.get(k)!r} expected={expected[k]!r}')

          audit={
            'verdict':'PASS',
            'rows':total,
            'positive_prices':positive,
            'variable_weight_rows':variable,
            'store_code':'010548',
            'catalog_complete':metadata.get('catalog_complete'),
            'source_unique_skus':int(metadata['source_unique_skus']),
            'food_rows':int(metadata['food_rows']),
            'flyer_rows':int(metadata['flyer_rows']),
            'visual_rows':int(metadata['visual_rows'])
          }
          Path('conad_stable_full_db_audit.json').write_text(json.dumps(audit,indent=2),encoding='utf-8')
          print(json.dumps(audit,indent=2))
          PY

      - name: SQLite integrity check
        run: |
          sqlite3 prezzi_conad_capodrise_stable_full.db "PRAGMA integrity_check;"
          sqlite3 prezzi_conad_capodrise_stable_full.db "SELECT COUNT(*), MIN(price_eur), MAX(price_eur) FROM products_current;"

      - name: Commit stable full DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add prezzi_conad_capodrise_stable_full.db conad_stable_full_db_audit.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish Conad Capodrise stable full Android DB"
          git pull --rebase origin probe-conad-full-catalog
          git push origin HEAD:probe-conad-full-catalog
