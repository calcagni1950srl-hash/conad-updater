name: CONAD GOURMET OVERVIEW
# rerun tiny visual overview

on:
  workflow_dispatch:
  push:
    paths:
      - 'conad_gourmet_overview.py'
      - '.github/workflows/CONAD_GOURMET_OVERVIEW.yml'

permissions:
  contents: write

jobs:
  overview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pillow
        run: pip install pillow
      - name: Build visual overview
        run: python conad_gourmet_overview.py
      - name: Commit overview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe_gourmet_pages/overview_20_pages_tiny.jpg probe_gourmet_pages/overview_20_pages_tiny.b64.txt
          git diff --cached --quiet && exit 0
          git commit -m "Build Gourmet flyer visual overview"
          git push
