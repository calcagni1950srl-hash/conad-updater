name: Conad Capodrise Browser Probe V2

on:
  workflow_dispatch:
  push:
    paths:
      - 'conad_capodrise_browser_probe_v2.py'
      - '.github/workflows/conad_capodrise_browser_probe_v2.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Select visible confirmation button in diagnostic probe
        run: |
          sed -i "s/page.locator('button:has-text(\"Conferma il negozio\")').first/page.locator('button:has-text(\"Conferma il negozio\")').last/" conad_capodrise_browser_probe_v2.py
      - name: Capture official Conad Capodrise store session
        run: xvfb-run -a python conad_capodrise_browser_probe_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conad-capodrise-browser-probe-v2
          path: |
            conad_capodrise_browser_v2.json
            conad_capodrise_browser_v2.png
          if-no-files-found: ignore
