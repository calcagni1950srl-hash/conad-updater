name: CONAD DOM PROMO PROBE

on:
  workflow_dispatch:
  push:
    paths:
      - 'conad_dom_promo_loader_probe.py'
      - '.github/workflows/CONAD_DOM_PROMO_PROBE.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probe official store promotional loaders
        run: python conad_dom_promo_loader_probe.py
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conad_dom_promo_loader_probe.json
          git diff --cached --quiet && exit 0
          git commit -m "Audit Conad Capodrise promo loaders"
          git push
