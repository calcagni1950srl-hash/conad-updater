name: Conad Capodrise Public Flyers Probe
on:
  push:
    paths:
      - 'conad_capodrise_flyers_public_probe.py'
      - '.github/workflows/conad_capodrise_flyers_public_probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probe official Capodrise flyer sources
        run: python conad_capodrise_flyers_public_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conad-capodrise-public-flyers-probe
          path: |
            conad_capodrise_flyers_public_probe.json
            conad_capodrise_flyers_public_probe.png
