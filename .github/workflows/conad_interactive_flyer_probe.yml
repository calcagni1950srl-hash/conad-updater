name: Conad Interactive Flyer Probe

on:
  push:
    paths:
      - 'conad_interactive_flyer_probe.py'
      - '.github/workflows/conad_interactive_flyer_probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probe Conad interactive flyers
        run: python conad_interactive_flyer_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conad-interactive-flyer-probe
          path: |
            conad_interactive_flyer_probe.json
            interactive_flyer_*.png
