name: V81 BUILD FULL CONAD DB
on:
  push:
    branches:
      - probe-conad-full-catalog
    paths:
      - 'tmp_v81_conad_db_parts/**'
      - '.github/workflows/V81_BUILD_FULL_CONAD_DB.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probe-conad-full-catalog
          fetch-depth: 0

      - name: Rebuild exact SQLite DB
        shell: bash
        run: |
          set -euo pipefail
          cat tmp_v81_conad_db_parts/conad_db_part_*.b64 | tr -d '\n\r' | base64 -d > prezzi_conad_capodrise_stable_full.db
          echo "883954714dcc7fc4c54a89ea8773e3c58cd972af089e496556ed4ab328d4e1ad  prezzi_conad_capodrise_stable_full.db" | sha256sum -c -

      - name: Validate DB content
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3
          p='prezzi_conad_capodrise_stable_full.db'
          con=sqlite3.connect(p)
          row=con.execute("select count(*), min(price_eur), sum(variable_weight), sum(promo_active_general), min(store_code), max(store_code) from products_current").fetchone()
          meta=dict(con.execute("select key,value from metadata"))
          con.close()
          assert row[0] == 6841, row
          assert row[1] > 0, row
          assert row[2] == 67, row
          assert row[3] == 443, row
          assert row[4] == '010548' and row[5] == '010548', row
          assert meta.get('catalog_complete') == 'true', meta
          assert meta.get('flyer_rows') == '0', meta
          assert meta.get('visual_rows') == '0', meta
          assert meta.get('saved_food_products') == '6841', meta
          print('V81 FULL CONAD DB VALIDATED', row)
          PY

      - name: Commit final DB and remove transfer chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prezzi_conad_capodrise_stable_full.db
          git rm -r tmp_v81_conad_db_parts
          git rm .github/workflows/V81_BUILD_FULL_CONAD_DB.yml
          git commit -m "Publish V81 full stable Conad Capodrise DB"
          git push origin HEAD:probe-conad-full-catalog
