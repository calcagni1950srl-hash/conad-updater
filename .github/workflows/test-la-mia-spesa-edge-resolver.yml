name: Test La Mia Spesa Edge Resolver
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/test-la-mia-spesa-edge-resolver.yml
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cold-ish self test
        run: |
          set -euo pipefail
          URL='https://bbvxhepsyuejltglojtf.supabase.co/functions/v1/la-mia-spesa-resolver-v1?selftest=2'
          curl -sS --fail --max-time 30 -w '\nHTTP=%{http_code} TOTAL=%{time_total}\n' "$URL"
      - name: Warm self test
        run: |
          set -euo pipefail
          URL='https://bbvxhepsyuejltglojtf.supabase.co/functions/v1/la-mia-spesa-resolver-v1?selftest=2'
          curl -sS --fail --max-time 30 -w '\nHTTP=%{http_code} TOTAL=%{time_total}\n' "$URL"

