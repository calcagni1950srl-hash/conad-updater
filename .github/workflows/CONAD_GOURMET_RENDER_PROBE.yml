name: CONAD GOURMET RENDER PROBE

on:
  workflow_dispatch:
  push:
    paths:
      - 'conad_gourmet_render_probe.py'
      - '.github/workflows/CONAD_GOURMET_RENDER_PROBE.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pymupdf pillow
      - name: Render official image-only Gourmet flyer
        run: python conad_gourmet_render_probe.py
      - name: Commit visual probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe_gourmet_pages
          git diff --cached --quiet && exit 0
          git commit -m "Render active Conad Gourmet flyer for visual audit"
          git push
