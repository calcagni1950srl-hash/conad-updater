name: Audit Conad DB
on:
  push:
    paths:
      - 'audit_conad_db.py'
      - '.github/workflows/audit_conad_db.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python audit_conad_db.py
      - uses: actions/upload-artifact@v4
        with:
          name: conad-db-audit
          path: conad_db_audit.json
          retention-days: 90