name: FAMILA ENGINE CATALOGO
on:
  workflow_dispatch:
    inputs:
      store_alias:
        description: "Store alias CosìComodo già validato"
        required: true
        default: "teverola"

jobs:
  build_catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Costruisci catalogo Famila
        run: python FAMILA_ENGINE_CATALOGO.py --store "${{ inputs.store_alias }}"

      - name: Pubblica artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FAMILA-ENGINE-CATALOGO-RISULTATO
          path: |
            prezzi_famila.db
            famila_audit.json
          if-no-files-found: warn
