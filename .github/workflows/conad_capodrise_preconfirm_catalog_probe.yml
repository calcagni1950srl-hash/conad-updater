name: Conad Capodrise Preconfirm Catalog Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'conad_capodrise_preconfirm_catalog_probe.py'
      - '.github/workflows/conad_capodrise_preconfirm_catalog_probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Test catalog after normal Capodrise selection, before protected confirmation
        run: xvfb-run -a python conad_capodrise_preconfirm_catalog_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conad-capodrise-preconfirm-catalog-probe
          path: |
            conad_capodrise_preconfirm_catalog.json
            conad_capodrise_preconfirm_catalog.png
          if-no-files-found: ignore
