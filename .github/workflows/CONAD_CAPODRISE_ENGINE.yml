name: CONAD CAPODRISE ENGINE

on:
  workflow_dispatch:
  push:
    paths:
      - 'CONAD_CAPODRISE_ENGINE.py'
      - 'CONAD_BASSI_FISSI_ENGINE.py'
      - '.github/workflows/CONAD_CAPODRISE_ENGINE.yml'
  schedule:
    - cron: '30 4 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright requests pymupdf beautifulsoup4
          python -m playwright install --with-deps chromium

      - name: Refresh official Conad Bassi e Fissi base
        run: python CONAD_BASSI_FISSI_ENGINE.py

      - name: Overlay active PAC Campania offers for store 010548
        run: python CONAD_CAPODRISE_ENGINE.py

      - name: Final SQLite audit
        id: sqlite_audit
        run: |
          python - <<'PY'
          import json, sqlite3, datetime
          today=datetime.date.today()
          for name, minimum in [('prezzi_conad_capodrise.db', 740), ('prezzi_conad_capodrise_app.db', 600)]:
              con=sqlite3.connect(name)
              rows=con.execute('select count(*) from products_current').fetchone()[0]
              positive=con.execute('select count(*) from products_current where price_eur>0').fetchone()[0]
              stores=con.execute('select distinct store_code from products_current').fetchall()
              local=con.execute("select count(*) from products_current where product_code like 'FLYER:%'").fetchone()[0]
              refs=con.execute("select count(*) from products_current where product_code like 'REF:%'").fetchone()[0]
              meta=dict(con.execute("select key,value from metadata").fetchall())
              valid_to=(meta.get('local_flyer_valid_to') or '').strip()
              active_main=False
              if valid_to:
                  try:
                      active_main=datetime.date.fromisoformat(valid_to) >= today
                  except ValueError:
                      active_main=False
              print(json.dumps({'db':name,'rows':rows,'positive':positive,'stores':stores,'local_offers':local,'reference_fallbacks':refs,'active_main_flyer':active_main,'local_flyer_valid_to':valid_to}))
              assert rows >= minimum
              assert rows == positive
              assert stores == [('010548',)]
              if active_main:
                  assert local >= 40
              else:
                  assert local == 0
              assert refs == 5
              con.close()
          PY

      - name: V81 final Kotlin QA
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl
          curl -L -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          export PATH="/tmp/kotlin/kotlinc/bin:$PATH"
          kotlinc -version

          python V81_EXPORT_ANDROID_PRODUCTS.py
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path("conad_v81_android_products.jsonl")
          out=Path("qa_v81/products_v81_android.tsv")
          rows=[]
          for line in src.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              x=json.loads(line)
              def clean(v):
                  if v is None:
                      return ""
                  return str(v).replace("\t"," ").replace("\r"," ").replace("\n"," ")
              rows.append([
                  clean(x.get("key")),
                  clean(x.get("name")),
                  clean(x.get("brand")),
                  clean(x.get("category")),
                  clean(x.get("quantityValue")),
                  clean(x.get("quantityUnit")),
                  clean(x.get("priceEur")),
                  clean(x.get("unitPriceEur")),
                  clean(x.get("unitPriceUnit")),
                  "1" if x.get("variableWeight") else "0",
                  clean(x.get("sourceUrl")),
                  clean(x.get("checkedAt")),
              ])
          with out.open("w", encoding="utf-8") as fh:
              fh.write("key\tname\tbrand\tcategory\tquantityValue\tquantityUnit\tpriceEur\tunitPriceEur\tunitPriceUnit\tvariableWeight\tsourceUrl\tcheckedAt\n")
              for row in rows:
                  fh.write("\t".join(row)+"\n")
          if len(rows) < 600:
              raise SystemExit(f"Expected at least 600 Android products, got {len(rows)}")
          PY

          kotlinc             qa_v81/SupermarketRepositoryStub.kt             qa_v81/ShoppingCalculator.kt             qa_v81/IngredientMatcher_V81_CONAD.kt             qa_v81/ConadV81Harness.kt             -include-runtime             -d qa_v81/v81-conad-harness.jar

          java -jar qa_v81/v81-conad-harness.jar             qa_v81/products_v81_android.tsv             qa_v81/recipes_v61_157.tsv             2 | tee qa_v81/v81_kotlin_conad_report.txt

          python - <<'PY'
          from pathlib import Path
          import re
          text=Path("qa_v81/v81_kotlin_conad_report.txt").read_text(encoding="utf-8")
          def val(k):
              m=re.search(rf"(?m)^{re.escape(k)}=(.+)$", text)
              if not m:
                  raise SystemExit(f"Missing {k}")
              return m.group(1).strip()
          expected={
              "recipes_total":"157",
              "threshold_primi":"true",
              "threshold_secondi":"true",
              "threshold_contorni":"true",
          }
          for k,v in expected.items():
              got=val(k)
              if got.lower()!=v.lower():
                  raise SystemExit(f"{k}: expected {v}, got {got}")
          if int(val("products")) < 600:
              raise SystemExit(f'products: expected at least 600, got {val("products")}')
          print({
              "recipes_total":val("recipes_total"),
              "recipes_testable":val("recipes_testable"),
              "recipes_complete":val("recipes_complete"),
              "primi_complete":val("primi_complete"),
              "secondi_complete":val("secondi_complete"),
              "contorni_complete":val("contorni_complete"),
          })
          PY

      - uses: actions/upload-artifact@v4
        if: always() && steps.sqlite_audit.outcome == 'success'
        with:
          name: conad-capodrise-current
          path: |
            prezzi_conad_capodrise.db
            prezzi_conad_capodrise_app.db
            conad_bassifissi_audit.json
            conad_capodrise_audit.json

      - name: Commit current Conad Capodrise databases
        if: always() && steps.sqlite_audit.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prezzi_conad_capodrise.db prezzi_conad_capodrise_app.db conad_bassifissi_audit.json conad_capodrise_audit.json
          [ -f qa_v81/v81_kotlin_conad_report.txt ] && git add qa_v81/v81_kotlin_conad_report.txt || true
          [ -f conad_v81_android_products.jsonl ] && git add conad_v81_android_products.jsonl || true
          git diff --cached --quiet && exit 0
          git commit -m "Update current Conad Capodrise databases"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

# retrigger after QA matcher alignment 2026-09-19
