name: La Mia Spesa Conad QA

on:
  push:
    branches: [probe-conad-full-catalog]
    paths:
      - '.github/workflows/LAMIASPESA_CONAD_QA.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probe-conad-full-catalog

      - name: Validate full Conad catalog for La Mia Spesa
        run: |
          python - <<'PY'
          import json, sqlite3, time
          from pathlib import Path

          db = Path("prezzi_conad_capodrise_stable_full.db")
          con = sqlite3.connect(db)
          con.row_factory = sqlite3.Row

          cols = {r[1] for r in con.execute("PRAGMA table_info(products_current)")}
          total = con.execute("SELECT COUNT(*) FROM products_current WHERE price_eur > 0").fetchone()[0]
          images = con.execute(
              "SELECT COUNT(*) FROM products_current WHERE price_eur > 0 AND COALESCE(image_url,'') <> ''"
          ).fetchone()[0] if "image_url" in cols else 0

          def rows_for(term):
              q = """
              SELECT product_name, brand, category1, category2, category3,
                     quantity_value, quantity_unit, price_eur, unit_price, unit_price_unit,
                     variable_weight
              FROM products_current
              WHERE price_eur > 0 AND LOWER(product_name) LIKE ?
              ORDER BY price_eur
              LIMIT 30
              """
              return [dict(r) for r in con.execute(q, (f"%{term}%",))]

          report = {
              "integrity": con.execute("PRAGMA integrity_check").fetchone()[0],
              "positive_rows": total,
              "image_rows": images,
              "patate_candidates": rows_for("patat"),
              "zucchine_candidates": rows_for("zucchin"),
              "barilla_candidates": rows_for("barilla"),
          }
          con.close()

          Path("lamiaspesa_conad_qa.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps({
              "integrity": report["integrity"],
              "positive_rows": total,
              "image_rows": images,
              "patate_count_sample": len(report["patate_candidates"]),
              "zucchine_count_sample": len(report["zucchine_candidates"]),
              "barilla_count_sample": len(report["barilla_candidates"]),
          }, ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: lamiaspesa-conad-qa
          path: lamiaspesa_conad_qa.json
