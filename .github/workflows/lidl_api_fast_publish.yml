name: Fast publish Lidl API catalog
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [probe-lidl-catalog]
    paths:
      - LIDL_API_CATALOG.py
      - .github/workflows/lidl_api_fast_publish.yml
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probe-lidl-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build complete Lidl API catalog
        run: python LIDL_API_CATALOG.py
      - name: Validate and publish Android DB
        run: |
          set -euo pipefail
          test -s prezzi_lidl_api.db
          test "$(sqlite3 prezzi_lidl_api.db "PRAGMA integrity_check;")" = "ok"
          COUNT="$(sqlite3 prezzi_lidl_api.db "SELECT COUNT(*) FROM products_android WHERE price_eur > 0;")"
          echo "LIDL_PRODUCTS=$COUNT"
          test "$COUNT" -ge 1000
          cp prezzi_lidl_api.db prezzi_lidl_everli.db
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f prezzi_lidl_everli.db
          if ! git diff --cached --quiet; then
            git commit -m "Publish complete Lidl API Android catalog [skip ci]"
            git push origin HEAD:probe-lidl-catalog
          fi
