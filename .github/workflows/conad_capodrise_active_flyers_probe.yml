name: Conad Capodrise Active Flyers Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'conad_capodrise_active_flyers_probe.py'
      - '.github/workflows/conad_capodrise_active_flyers_probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: pip install requests pypdf
      - name: Extract active official Capodrise flyers
        run: python conad_capodrise_active_flyers_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conad-capodrise-active-flyers-probe
          path: conad_capodrise_active_flyers_probe.json
          if-no-files-found: ignore
          retention-days: 30
