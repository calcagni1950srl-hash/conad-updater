name: Conad DOM Promo Loader Probe
on:
  push:
    paths:
      - 'conad_dom_promo_loader_probe.py'
      - '.github/workflows/conad_dom_promo_loader_probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect promotion loader data
        run: python conad_dom_promo_loader_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conad-dom-promo-loader-probe
          path: conad_dom_promo_loader_probe.json
