name: Diagnosi Famila V5 - NextData catalogo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Famila NextData Probe V5
        run: python probe_famila_nextdata_v5.py

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: famila-nextdata-probe-v5
          path: famila_v5_artifact/
          if-no-files-found: error
          retention-days: 14
