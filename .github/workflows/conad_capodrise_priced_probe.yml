name: Conad Capodrise Priced Probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'conad_capodrise_priced_probe.py'
      - 'conad_capodrise_ui_probe.py'
      - '.github/workflows/conad_capodrise_priced_probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Validate Capodrise priced catalog through public UI
        run: python conad_capodrise_ui_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conad-capodrise-priced-probe
          path: |
            conad_capodrise_priced_probe.json
            conad_*.png
          if-no-files-found: ignore
