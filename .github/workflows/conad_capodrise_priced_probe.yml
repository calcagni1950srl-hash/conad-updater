name: Conad Capodrise Priced Probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'conad_capodrise_priced_probe.py'
      - 'conad_capodrise_ui_probe.py'
      - '.github/workflows/conad_capodrise_priced_probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Patch robust public UI flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('conad_capodrise_priced_probe.py')
          s = p.read_text(encoding='utf-8')

          old = '''async def click_first(page, selectors, out, step, timeout=5000):
              for sel in selectors:
                  try:
                      loc = page.locator(sel).first
                      if await loc.count() and await loc.is_visible():
                          await loc.click(timeout=timeout)
                          out["steps"].append({"step": step, "ok": True, "selector": sel})
                          await page.wait_for_timeout(1200)
                          return True
                  except Exception:
                      pass
              out["steps"].append({"step": step, "ok": False})
              return False
          '''
          new = '''async def click_first(page, selectors, out, step, timeout=5000):
              for sel in selectors:
                  try:
                      loc = page.locator(sel)
                      count = await loc.count()
                      for i in range(count - 1, -1, -1):
                          item = loc.nth(i)
                          try:
                              if await item.is_visible():
                                  await item.click(timeout=timeout)
                                  out["steps"].append({"step": step, "ok": True, "selector": sel, "match_index": i})
                                  await page.wait_for_timeout(1200)
                                  return True
                          except Exception:
                              continue
                  except Exception:
                      pass
              out["steps"].append({"step": step, "ok": False})
              return False
          '''
          if old in s:
              s = s.replace(old, new)

          old_verify = '''    await click_first(page, [
                  'button:has-text("Verifica")', 'button:has-text("Continua")', 'button:has-text("Avanti")'
              ], out, "verify_address", timeout=7000)
          '''
          new_verify = '''    verified = await page.evaluate("""() => {
              const visible = el => {
                const s = getComputedStyle(el), r = el.getBoundingClientRect();
                return s.visibility !== 'hidden' && s.display !== 'none' && r.width > 0 && r.height > 0;
              };
              const els = [...document.querySelectorAll('button,[role="button"]')];
              const target = els.find(el => visible(el) && (el.innerText || el.textContent || '').trim() === 'Verifica');
              if (!target) return false;
              target.click();
              return true;
            }""")
              out["steps"].append({"step": "verify_address_dom", "ok": bool(verified)})
              await page.wait_for_timeout(1800)
          '''
          if old_verify in s:
              s = s.replace(old_verify, new_verify)

          start = s.index('async def select_pickup(page, out):')
          end = s.index('\n\nasync def select_store(page, out):', start)
          replacement = '''async def select_pickup(page, out):
              buttons = page.locator('button:has-text("Seleziona")')
              visible = []
              labels = []
              for i in range(await buttons.count()):
                  b = buttons.nth(i)
                  if not await b.is_visible():
                      continue
                  visible.append(b)
                  label = ""
                  node = b
                  for _ in range(4):
                      try:
                          node = node.locator("..")
                          text = (await node.inner_text()).strip().replace("\\n", " ")
                          if text and len(text) < 500:
                              label = text
                              if "Ordina e ritira" in text or "Spesa a casa" in text:
                                  break
                      except Exception:
                          break
                  labels.append(label)
              out["steps"].append({"step":"pickup_candidates","ok":bool(visible),"labels":labels})
              for idx, label in enumerate(labels):
                  low = label.lower()
                  if "ordina e ritira" in low or ("ritira" in low and "spesa a casa" not in low):
                      await visible[idx].click(timeout=6000)
                      out["steps"].append({"step":"select_pickup","ok":True,"visible_index":idx,"label":label[:300]})
                      await page.wait_for_timeout(3000)
                      return True
              out["steps"].append({"step":"select_pickup","ok":False,"labels":labels})
              return False
          '''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate Capodrise priced catalog through public UI
        run: python conad_capodrise_priced_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conad-capodrise-priced-probe
          path: |
            conad_capodrise_priced_probe.json
            conad_*.png
          if-no-files-found: ignore
