name: Conad Exact Offer Component Probe
on:
  push:
    paths:
      - 'conad_exact_offer_component_probe.py'
      - '.github/workflows/conad_exact_offer_component_probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Locate exact in-store offer component
        run: python conad_exact_offer_component_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conad-exact-offer-component-probe
          path: conad_exact_offer_component_probe.json
