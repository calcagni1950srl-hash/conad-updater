name: Conad Public Store Param Probe
on:
  push:
    paths:
      - 'conad_public_store_param_probe.py'
      - '.github/workflows/conad_public_store_param_probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: pip install requests
      - name: Test public store query parameters
        run: python conad_public_store_param_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conad-public-store-param-probe
          path: conad_public_store_param_probe.json
