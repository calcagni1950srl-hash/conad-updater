name: Aggiorna prezzi Decò V2
on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -u updater_deco.py
      - name: Verifica database
        run: |
          python - <<'PY'
          import sqlite3
          c=sqlite3.connect("prezzi_deco.db")
          n,u,z=c.execute("select count(*),count(distinct product_key),sum(price_eur<=0) from products").fetchone()
          print("prodotti",n,"unici",u,"prezzi_non_validi",z)
          assert n>0 and n==u and z==0
          PY
      - name: Commit database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prezzi_deco.db
          git diff --cached --quiet || git commit -m "Aggiorna prezzi Decò"
          git push
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deco-diagnostics
          path: |
            deco_failure.txt
          if-no-files-found: ignore
