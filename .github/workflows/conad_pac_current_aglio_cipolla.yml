name: Conad PAC Current Garlic Onion Probe
on:
  push:
    paths:
      - 'conad_pac_current_aglio_cipolla.py'
      - '.github/workflows/conad_pac_current_aglio_cipolla.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pymupdf
      - name: Probe current PAC Campania flyers
        run: python conad_pac_current_aglio_cipolla.py
      - uses: actions/upload-artifact@v4
        with:
          name: conad-pac-current-aglio-cipolla
          path: conad_pac_current_aglio_cipolla.json
