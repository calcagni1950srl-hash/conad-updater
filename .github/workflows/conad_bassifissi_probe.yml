name: Conad Bassi e Fissi Probe

on:
  push:
    paths:
      - 'conad_bassifissi_probe.py'
      - '.github/workflows/conad_bassifissi_probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probe public Conad Bassi e Fissi page
        run: python conad_bassifissi_probe.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conad-bassifissi-probe
          path: |
            conad_bassifissi_probe.json
            conad_bassifissi_probe.png
          if-no-files-found: warn
